<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #eef3ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-top: 5px solid #0055ff;
        }

        h2 {
            text-align: center;
            color: #0055ff;
            margin-bottom: 20px;
            font-size: 22px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            appearance: none; /* remove green autofill box */
            -webkit-appearance: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0055ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .qr-box {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 5px;
        }

    </style>

    <script>
        function enableSubmit() {
            document.getElementById("submitBtn").disabled =
                !document.getElementById("paid").checked;
        }
    </script>
</head>

<body>

<div class="container">

    <h2>Financial Registration Form</h2>

    <form action="/submit" method="POST" enctype="multipart/form-data">

        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="mobile" placeholder="Mobile" required>
        <input type="text" name="address" placeholder="Address" required>
        <input type="text" name="father_name" placeholder="Father Name" required>
        <input type="text" name="mother_name" placeholder="Mother Name" required>
        <input type="text" name="ref_name" placeholder="Reference Name" required>
        <input type="text" name="ref_contact" placeholder="Reference Contact" required>
        <input type="number" name="amount_needed" placeholder="Amount Needed" required>
        <input type="text" name="purpose" placeholder="Purpose" required>
        <label>Return Date</label>
        <input type="date" name="return_date" required>

        <label>Aadhaar Upload</label>
        <input type="file" name="aadhaar" accept="image/*" required>

        <label>PAN Upload</label>
        <input type="file" name="pan" accept="image/*" required>

        <label>Self Image Upload</label>
        <input type="file" name="self_image" accept="image/*" required>

        <h3 style="text-align:center; color:#333;">Stamp Paper Fee: <b>₹99</b></h3>
        <h3 style="text-align:center; color:#333;">Mobile No: <b>7022118670</b></h3>

        <div class="qr-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=7022118670@ybl&pn=Financial+Registration&cu=INR"
                 width="200">
        </div>

        <div style="margin-top:15px;">
            <input type="checkbox" id="paid" onclick="enableSubmit()">
            I confirm I have paid ₹99.
        </div>

        <button id="submitBtn" disabled type="submit">Submit</button>

    </form>
</div>

</body>
</html>
