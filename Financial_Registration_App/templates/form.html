<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">Customer Registration</h1>

    <form action="/submit" method="POST" enctype="multipart/form-data" class="space-y-4">
      <input name="name" placeholder="Full Name" class="w-full p-2 border rounded" required>
      <input name="mobile" placeholder="Mobile Number" class="w-full p-2 border rounded" required>
      <input name="address" placeholder="Address" class="w-full p-2 border rounded" required>
      <input name="father_name" placeholder="Father's Name" class="w-full p-2 border rounded" required>
      <input name="mother_name" placeholder="Mother's Name" class="w-full p-2 border rounded" required>
      <input name="reference_contact" placeholder="Reference Contact" class="w-full p-2 border rounded" required>

      <label class="block">Aadhaar Card:</label>
      <input type="file" name="aadhaar" accept="image/*" required class="block w-full border p-2 rounded">

      <label class="block">PAN Card:</label>
      <input type="file" name="pan" accept="image/*" required class="block w-full border p-2 rounded">

      <label class="block">Blank Cheque:</label>
      <input type="file" name="cheque" accept="image/*" required class="block w-full border p-2 rounded">

      <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700">
        Submit & Pay ₹99
      </button>
    </form>
  </div>
</body>
</html>
