<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #eef3ff;
            padding: 30px;
        }
        .container {
            width: 450px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-top: 5px solid #0055ff;
        }
        h2 {
            text-align: center;
            color: #0055ff;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0055ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .upi-btn {
            background: #00b900;
        }
    </style>

    <script>
        function payUPI() {
            const url =
                "upi://pay?pa=7022118670@ybl&pn=Financial%20Registration&am=99&cu=INR&mode=02&purpose=Fees";

            window.location.href = url;
        }

        function enableSubmit() {
            document.getElementById("submitBtn").disabled =
                !document.getElementById("paid").checked;
        }
    </script>
</head>

<body>

<div class="container">

    <h2>Financial Registration Form</h2>

    <form action="/submit" method="POST" enctype="multipart/form-data">

        <input type="text" name="name" placeholder="Name" required>

        <input type="text" name="mobile" placeholder="Mobile" required>

        <input type="text" name="address" placeholder="Address" required>

        <input type="text" name="father_name" placeholder="Father Name" required>

        <input type="text" name="mother_name" placeholder="Mother Name" required>

        <input type="text" name="ref_name" placeholder="Reference Name" required>

        <input type="text" name="ref_contact" placeholder="Reference Contact" required>

        <input type="number" name="amount_needed" placeholder="Amount Needed" required>

        <input type="text" name="purpose" placeholder="Purpose" required>

        <input type="date" name="return_date" required>

        <label>Aadhaar Upload</label>
        <input type="file" name="aadhaar" accept="image/*" required>

        <label>PAN Upload</label>
        <input type="file" name="pan" accept="image/*" required>

        <h3>Stamp Paper Fee: ₹99</h3>

        <button type="button" class="upi-btn" onclick="payUPI()">Pay ₹99 UPI</button>

        <input type="checkbox" id="paid" onclick="enableSubmit()">
        I confirm I have paid the amount.

        <button id="submitBtn" disabled type="submit">Submit</button>

    </form>
</div>

</body>
</html>
